<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="boot" role="status" aria-live="polite">
    <img src="icon.png" alt="" class="boot-logo">
    <div class="spinner"></div>
    <p id="boot-msg">Starting Cloudy…</p>
  </div>

  <div id="app" class="app hidden">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><img src="icon.png" alt="" class="brand-logo"><span class="brand-name">Cloudy</span></div>
      <button class="btn btn-primary new-btn" data-action="upload-menu" aria-haspopup="menu" id="new-btn"></button>
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-foot">
        <div class="pool-meter" id="pool-meter"></div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="search" role="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="search" placeholder="Search all your files  ( / )" autocomplete="off" spellcheck="false" aria-label="Search files">
          <button class="icon-btn search-clear hidden" data-action="clear-search" aria-label="Clear search" id="search-clear"></button>
        </div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <div id="banner" class="banner-area"></div>
      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="dropzone" class="dropzone hidden" aria-hidden="true">
    <div class="dropzone-card"><div id="dropzone-icon"></div><strong>Drop to upload</strong><span id="dropzone-sub">into the pool</span></div>
  </div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
