[package]
name = "clouddrive-gui"
version = "0.1.0"
edition = "2021"
description = "Cloudy desktop app (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clouddrive-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
open = "5"
rand = "0.8"
url = "2"
percent-encoding = "2"
bytes = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
